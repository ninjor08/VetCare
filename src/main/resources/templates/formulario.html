<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VetCare - Formulario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

    <h2>Registrar / Editar Mascota</h2>

    <form th:action="@{/mascotas/guardar}" th:object="${mascota}" method="post">

        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label>Nombre</label>
            <input type="text" th:field="*{nombre}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label>Edad</label>
            <input type="number" th:field="*{edad}" class="form-control" min="0" required>
        </div>

        <div class="mb-3">
            <label>Raza</label>
            <input type="text" th:field="*{raza}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label>Especie</label>
            <select name="especieId" class="form-select" required>
                <option value="">Seleccione una especie</option>
                <option th:each="e : ${especies}"
                        th:value="${e.id}"
                        th:text="${e.nombre}"
                        th:selected="${mascota.especie != null and mascota.especie.id == e.id}">
                </option>
            </select>
        </div>

        <button type="submit" class="btn btn-success">Guardar</button>
        <a href="/mascotas" class="btn btn-secondary">Cancelar</a>

    </form>

</body>
</html>
