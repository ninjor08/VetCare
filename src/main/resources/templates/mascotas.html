<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VetCare - Mascotas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

    <h2>VetCare - Mascotas</h2>

    <a href="/mascotas/nueva" class="btn btn-primary mb-3">
        Nueva mascota
    </a>

    <form th:action="@{/logout}" method="post" class="d-inline">
        <button type="submit" class="btn btn-secondary mb-3">
            Cerrar sesión
        </button>
    </form>

    <div class="table-responsive">
        <table class="table table-bordered">
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Edad</th>
                    <th>Raza</th>
                    <th>Especie</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="m : ${mascotas}">
                    <td th:text="${m.nombre}"></td>
                    <td th:text="${m.edad}"></td>
                    <td th:text="${m.raza}"></td>
                    <td th:text="${m.especie != null ? m.especie.nombre : ''}"></td>
                    <td>
                        <a th:href="@{/mascotas/editar/{id}(id=${m.id})}"
                           class="btn btn-warning btn-sm">
                            Editar
                        </a>

                        <form th:action="@{/mascotas/eliminar/{id}(id=${m.id})}"
                              method="post" class="d-inline">
                            <button type="submit" class="btn btn-danger btn-sm">
                                Eliminar
                            </button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</body>
</html>
